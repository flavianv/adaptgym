<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1030" viewBox="0 0 1480 1030" role="img" aria-labelledby="title desc">
<title id="title">AdaptGym — SFT training flow</title><desc id="desc">Six steps: generate synthetic traces, render natural conversations, verify information preservation, split into train validation and test by user family, fine-tune an extractor, and evaluate on held-out test sessions. Steps one to three are shared with the evaluation flow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6b756e"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#24332c}.role{font-size:13px;font-weight:700;letter-spacing:.6px}.step{font-size:28px;font-weight:700}.card-title{font-size:23px;font-weight:700}.body{font-size:17px;fill:#55665c}.small{font-size:15px;fill:#617168}</style></defs>
<rect width="1480" height="1030" rx="18" fill="#f8f9f5"/>
<text x="60" y="54" class="role" style="fill:#627269">ADAPTGYM · PROPOSED TRAINING FLOW</text>
<text x="60" y="106" style="font-size:38px;font-weight:700">SFT training flow</text>
<text x="60" y="143" class="body">The same data-creation steps as evaluation, followed by splitting, supervised fine-tuning and test evaluation.</text>
<text x="60" y="186" class="role" style="fill:#426486">STEPS 1–3 · SHARED WITH THE EVALUATION FLOW</text>
<g transform="translate(60 210)"><rect width="420" height="240" rx="12" fill="#fff" stroke="#cbd5cd"/><path d="M12 0H408Q420 0 420 12V43H0V12Q0 0 12 0" fill="#e5ede6"/><text x="20" y="28" class="role" style="fill:#3f614b">CODE · PROCEDURAL</text><text x="20" y="83" class="step">01</text><text x="20" y="120" class="card-title"><tspan x="20" dy="0">Generate synthetic</tspan><tspan x="20" dy="28">multi-turn traces</tspan></text><text x="20" y="190" class="body"><tspan x="20" dy="0">Control turns, endings and reveal events.</tspan><tspan x="20" dy="26">Compute reference states.</tspan></text></g><g transform="translate(530 210)"><rect width="420" height="240" rx="12" fill="#fff" stroke="#c8d3df"/><path d="M12 0H408Q420 0 420 12V43H0V12Q0 0 12 0" fill="#e6edf7"/><text x="20" y="28" class="role" style="fill:#426486">LARGE LLM · GENERATOR</text><text x="20" y="83" class="step">02</text><text x="20" y="120" class="card-title"><tspan x="20" dy="0">Render natural</tspan><tspan x="20" dy="28">conversations</tspan></text><text x="20" y="190" class="body"><tspan x="20" dy="0">Generate user wording around</tspan><tspan x="20" dy="26">programmed assistant responses.</tspan></text></g><g transform="translate(1000 210)"><rect width="420" height="240" rx="12" fill="#fff" stroke="#c8d3df"/><path d="M12 0H408Q420 0 420 12V43H0V12Q0 0 12 0" fill="#e6edf7"/><text x="20" y="28" class="role" style="fill:#426486">LARGE LLM · VERIFIER</text><text x="20" y="83" class="step">03</text><text x="20" y="120" class="card-title"><tspan x="20" dy="0">Check information</tspan><tspan x="20" dy="28">preservation</tspan></text><text x="20" y="190" class="body"><tspan x="20" dy="0">A separate pass checks whether sessions</tspan><tspan x="20" dy="26">support their reference states.</tspan></text></g><g transform="translate(60 560)"><rect width="420" height="240" rx="12" fill="#fff" stroke="#cbd5cd"/><path d="M12 0H408Q420 0 420 12V43H0V12Q0 0 12 0" fill="#e5ede6"/><text x="20" y="28" class="role" style="fill:#3f614b">CODE · DATA SPLIT</text><text x="20" y="83" class="step">04</text><text x="20" y="120" class="card-title"><tspan x="20" dy="0">Split into</tspan><tspan x="20" dy="28">train / validation / test</tspan></text><text x="20" y="190" class="body"><tspan x="20" dy="0">Group by user family before splitting.</tspan><tspan x="20" dy="26">Keep related sessions in the same split.</tspan></text></g><g transform="translate(530 560)"><rect width="420" height="240" rx="12" fill="#fff" stroke="#d5c9df"/><path d="M12 0H408Q420 0 420 12V43H0V12Q0 0 12 0" fill="#eee6f4"/><text x="20" y="28" class="role" style="fill:#77558e">SMALL LLM · SFT TRAINER</text><text x="20" y="83" class="step">05</text><text x="20" y="120" class="card-title"><tspan x="20" dy="0">Fine-tune the</tspan><tspan x="20" dy="28">extraction checkpoint</tspan></text><text x="20" y="190" class="body"><tspan x="20" dy="0">Train on prefix → reference-state pairs.</tspan><tspan x="20" dy="26">Use validation to select the checkpoint.</tspan></text></g><g transform="translate(1000 560)"><rect width="420" height="240" rx="12" fill="#fff" stroke="#cbd5cd"/><path d="M12 0H408Q420 0 420 12V43H0V12Q0 0 12 0" fill="#e5ede6"/><text x="20" y="28" class="role" style="fill:#3f614b">CODE · EVALUATION</text><text x="20" y="83" class="step">06</text><text x="20" y="120" class="card-title"><tspan x="20" dy="0">Evaluate on the</tspan><tspan x="20" dy="28">held-out test split</tspan></text><text x="20" y="190" class="body"><tspan x="20" dy="0">Extract after every user turn.</tspan><tspan x="20" dy="26">Compute precision, recall and coverage.</tspan></text></g><path d="M483 330H518" fill="none" stroke="#6b756e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M953 330H988" fill="none" stroke="#6b756e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M483 680H518" fill="none" stroke="#6b756e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M953 680H988" fill="none" stroke="#6b756e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1210 450V493H270V554" fill="none" stroke="#6b756e" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="500" y="475" width="480" height="31" fill="#f8f9f5"/><text x="740" y="498" text-anchor="middle" class="body">Checked sessions + per-turn reference states</text>
<rect x="60" y="839" width="1360" height="91" rx="10" fill="#edf1ea"/>
<text x="84" y="871" class="body">Train updates weights. Validation selects the checkpoint. Test measures final extraction quality.</text>
<text x="84" y="901" class="body">Reference states are supervised output targets; the evaluated extractor never receives the answer key.</text>
<text x="60" y="974" class="small">Proposed full SFT flow. The current experiment has train/validation data; a separate test split and the SFT trainer remain to be added.</text>
</svg>