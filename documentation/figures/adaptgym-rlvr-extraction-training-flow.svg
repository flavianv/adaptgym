<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1100" viewBox="0 0 1480 1100" role="img" aria-labelledby="title desc">
<title id="title">AdaptGym — RLVR training · extraction only</title>
<desc id="desc">Prepare and split data once; initialize a policy. Repeat sampling training episodes, generating rollouts with the current policy, computing code-based rewards and updating weights. Return to sampling for the next batch. Evaluate saved checkpoints separately on held-out data. Reference states are hidden from the extractor and supplied only to reward code.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#68766d"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#77558e"/></marker>
<marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a7752d"/></marker>
<style>text{font-family:Inter,Arial,sans-serif;fill:#24332c}.eyebrow{font-size:13px;letter-spacing:1.5px;font-weight:700;fill:#627269}.heading{font-size:36px;font-weight:700}.subtitle{font-size:18px;fill:#56665c}.role{font-size:11px;letter-spacing:.7px;font-weight:700}.card-title{font-size:21px;font-weight:700}.body{font-size:15px;fill:#526259}.label{font-size:15px;font-weight:600}.small{font-size:14px;fill:#617168}</style>
</defs>
<rect width="1480" height="1100" rx="18" fill="#f8f9f5"/>
<text x="60" y="48" class="eyebrow">ADAPTGYM · PROPOSED TRAINING ARCHITECTURE</text>
<text x="60" y="98" class="heading">RLVR training · extraction only</text><text x="60" y="133" class="subtitle">Improve intent extraction using rewards computed from supported reference states.</text>
<rect x="60" y="175" width="880" height="124" rx="12" fill="#edf2e9" stroke="#cbd5cd"/>
<text x="82" y="202" class="role" style="fill:#3f614b">ONCE · DATA PREPARATION</text>
<text x="82" y="232" class="body"><tspan x="82" dy="0">Generate traces → render sessions → check information preservation.</tspan><tspan x="82" dy="24">Split by user/scenario family into train / validation / test.</tspan><tspan x="82" dy="24">Freeze supported reference states and held-out partitions.</tspan></text><rect x="980" y="175" width="440" height="124" rx="12" fill="#eee6f4" stroke="#d5c9df"/>
<text x="1002" y="202" class="role" style="fill:#77558e">ONCE · POLICY INITIALIZATION</text><text x="1002" y="233" class="body"><tspan x="1002" dy="0">Load a suitable SFT extraction checkpoint.</tspan><tspan x="1002" dy="24">This supplies the initial trainable policy.</tspan></text><rect x="60" y="361" width="1360" height="433" rx="14" fill="#f3f0f6" stroke="#cbbbda"/>
<text x="82" y="392" class="eyebrow" style="fill:#77558e">REPEAT · TRAINING LOOP</text><g transform="translate(100.0 474)"><rect width="299.0" height="219" rx="10" fill="#fff" stroke="#cbd5cd"/><path d="M10 0H289.0Q299.0 0 299.0 10V40H0V10Q0 0 10 0" fill="#e5ede6"/><text x="16" y="26" class="role"><tspan x="16" dy="0">CODE · SAMPLER</tspan></text><text x="16" y="82" class="card-title"><tspan x="16" dy="0">Sample training</tspan><tspan x="16" dy="27">sessions / prefixes</tspan></text><text x="16" y="157" class="body"><tspan x="16" dy="0">Use only the training split.</tspan><tspan x="16" dy="25">Keep reference states hidden.</tspan></text></g><g transform="translate(427.0 474)"><rect width="299.0" height="219" rx="10" fill="#fff" stroke="#bda5cc"/><path d="M10 0H289.0Q299.0 0 299.0 10V40H0V10Q0 0 10 0" fill="#eee6f4"/><text x="16" y="26" class="role"><tspan x="16" dy="0">SMALL LLM · POLICY</tspan></text><text x="16" y="82" class="card-title"><tspan x="16" dy="0">Generate intent</tspan><tspan x="16" dy="27">with current policy</tspan></text><text x="16" y="157" class="body"><tspan x="16" dy="0">Predict after each user turn.</tspan><tspan x="16" dy="25">Carry its own state forward.</tspan></text></g><g transform="translate(754.0 474)"><rect width="299.0" height="219" rx="10" fill="#fff" stroke="#cbd5cd"/><path d="M10 0H289.0Q299.0 0 299.0 10V40H0V10Q0 0 10 0" fill="#e5ede6"/><text x="16" y="26" class="role"><tspan x="16" dy="0">CODE · VERIFIER</tspan></text><text x="16" y="82" class="card-title"><tspan x="16" dy="0">Compute verifiable</tspan><tspan x="16" dy="27">extraction rewards</tspan></text><text x="16" y="157" class="body"><tspan x="16" dy="0">Compare with reference states.</tspan><tspan x="16" dy="25">Apply declared matching rules.</tspan></text></g><g transform="translate(1081.0 474)"><rect width="299.0" height="219" rx="10" fill="#fff" stroke="#cbd5cd"/><path d="M10 0H289.0Q299.0 0 299.0 10V40H0V10Q0 0 10 0" fill="#e5ede6"/><text x="16" y="26" class="role"><tspan x="16" dy="0">RL OPTIMIZER</tspan></text><text x="16" y="82" class="card-title"><tspan x="16" dy="0">Update the</tspan><tspan x="16" dy="27">extraction policy</tspan></text><text x="16" y="157" class="body"><tspan x="16" dy="0">Optimize sampled outputs</tspan><tspan x="16" dy="25">using their computed rewards.</tspan></text></g><path d="M401.0 580H419.0" stroke="#68766d" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M728.0 580H746.0" stroke="#68766d" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M1055.0 580H1073.0" stroke="#68766d" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M249.5 299V330H80V540H94" stroke="#68766d" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M1200 299V330H576.5V466" stroke="#77558e" stroke-width="2.2" fill="none" marker-end="url(#purple)"/><text x="90" y="345" class="small"><tspan x="90" dy="0">Training data only</tspan></text><path d="M277.5 474V431H903.5V466" stroke="#a7752d" stroke-dasharray="6 5" stroke-width="1.8" fill="none" marker-end="url(#gold)"/><rect x="331.5" y="415" width="490" height="29" fill="#f3f0f6"/><text x="344.5" y="436" class="small"><tspan x="344.5" dy="0">Reference states → reward code only; hidden from policy</tspan></text><path id="training-feedback" d="M1230.5 693V754H249.5V701" stroke="#77558e" stroke-width="2.8" fill="none" marker-end="url(#purple)"/><rect x="390" y="738" width="700" height="29" fill="#f3f0f6"/><text x="420" y="759" class="label"><tspan x="420" dy="0">Updated policy → sample the next training batch → generate new rollouts</tspan></text><path d="M1380.0 660H1440V863H1388" stroke="#68766d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="827" width="1320" height="135" rx="12" fill="#fff" stroke="#cbd5cd"/>
<text x="82" y="855" class="role" style="fill:#3f614b">SEPARATE · CHECKPOINT EVALUATION</text><text x="82" y="885" class="body"><tspan x="82" dy="0">Evaluate saved checkpoints on fixed validation sessions; use the untouched test set for final reporting.</tspan><tspan x="82" dy="24">Compute extraction precision, recall and complete-turn coverage under the same declared matching rules.</tspan><tspan x="82" dy="24">Validation selects checkpoints. Held-out answers and scores are never used as training rewards.</tspan></text><text x="60" y="1003" class="small"><tspan x="60" dy="0">Training reward: a declared code-based metric (e.g. extraction F1), with explicit invalid-output handling.</tspan><tspan x="60" dy="25">Proposed flow. Data and evaluation exist; the separate test split, RL optimizer and reward objective remain to be implemented.</tspan></text></svg>