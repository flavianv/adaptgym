name: Public content checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_content.py
      - run: python -m pip install uv
      - name: Scan tracked files without transmitting credentials
        run: python scripts/check_repository_secrets.py
